name: Build Henge 0.4 test packages

# Pushing the dedicated test branch starts its build. Manual dispatch remains
# available. Each job checks out the triggering SHA rather than a moving branch.
on:
  push:
    branches:
      - work/0.4-ipados17-test
  workflow_dispatch:
    inputs:
      include_ipa:
        description: Also build an IPA for a sideloader (TIPA is always built)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# A newer push supersedes an unpublished test build on the same branch.
concurrency:
  group: henge-test-packages-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSK: ${{ github.workspace }}/Husk
  IOS_DEPS: ${{ github.workspace }}/Husk/build/ios-arm64/sysroot
  HENGE_PACKAGE_OUTPUT_DIR: ${{ github.workspace }}/packages
  HENGE_BUILD_LOG_DIR: ${{ github.workspace }}/build-logs
  HENGE_EXPECTED_VERSION: '0.4.0'
  HENGE_EXPECTED_BUILD: '4012'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  build:
    # Preserve the runner used by the successful 2ed42fcf61f2 build.
    runs-on: xcode-27
    timeout-minutes: 120
    defaults:
      run:
        shell: bash

    steps:
      - name: Prepare output directories
        run: mkdir -p "$HENGE_PACKAGE_OUTPUT_DIR" "$HENGE_BUILD_LOG_DIR"

      - name: Check out the selected Henge commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: Henge

      # Exact Husk checkout recovered from the successful 2ed42fcf61f2 job log.
      - name: Check out Husk
        uses: actions/checkout@v4
        with:
          repository: Leviidev/Husk
          ref: 29abb512d81bf8cc08babcbe7f7007cb557208ef
          path: Husk

      - name: Record source and toolchain provenance
        id: source
        run: |
          HENGE_SOURCE_COMMIT=$(git -C Henge rev-parse HEAD)
          HENGE_HUSK_COMMIT=$(git -C Husk rev-parse HEAD)
          printf 'HENGE_SOURCE_COMMIT=%s\nHENGE_HUSK_COMMIT=%s\n' "$HENGE_SOURCE_COMMIT" "$HENGE_HUSK_COMMIT" >> "$GITHUB_ENV"
          printf 'husk_sha=%s\n' "$HENGE_HUSK_COMMIT" >> "$GITHUB_OUTPUT"
          export HENGE_SOURCE_COMMIT HENGE_HUSK_COMMIT
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          data = {
              "henge_commit": os.environ["HENGE_SOURCE_COMMIT"],
              "husk_commit": os.environ["HENGE_HUSK_COMMIT"],
              "selected_ref": os.environ["GITHUB_REF"],
              "run_url": f'{os.environ["GITHUB_SERVER_URL"]}/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}',
              "xcode": subprocess.check_output(["xcodebuild", "-version"], text=True).strip(),
              "iphoneos_sdk": subprocess.check_output(["xcrun", "--sdk", "iphoneos", "--show-sdk-version"], text=True).strip(),
          }
          pathlib.Path(os.environ["HENGE_BUILD_LOG_DIR"], "provenance.json").write_text(json.dumps(data, indent=2) + "\n")
          print(json.dumps(data, indent=2))
          PY

      - name: Check the package validator
        working-directory: Henge
        run: python3 -m unittest discover -s ci/tests -v 2>&1 | tee "$HENGE_BUILD_LOG_DIR/validator-tests.log"

      - name: Test device authentication queue and HTTP framing
        working-directory: Henge
        run: |
          python3 tests/test_device_auth.py 2>&1 | tee "$HENGE_BUILD_LOG_DIR/device-auth-queue-tests.log"
          python3 tests/test_device_auth_http.py 2>&1 | tee "$HENGE_BUILD_LOG_DIR/device-auth-http-tests.log"

      - name: Test native authentication and signer isolation with synthetic backends
        working-directory: Henge
        run: |
          sh tests/run_device_auth_host.sh 2>&1 | tee "$HENGE_BUILD_LOG_DIR/device-auth-native-tests.log"
          sh tests/run_auth_bridge.sh 2>&1 | tee "$HENGE_BUILD_LOG_DIR/device-auth-bridge-tests.log"

      - name: Test temporary adapter in an owned macOS fixture
        if: ${{ !cancelled() }}
        working-directory: Henge
        run: |
          sh tests/run_guest_auth_process.sh 2>&1 | tee "$HENGE_BUILD_LOG_DIR/device-auth-process-tests.log"
          python3 tests/test_guest_auth_experiment.py 2>&1 | tee "$HENGE_BUILD_LOG_DIR/device-auth-guest-tests.log"

      - name: Test bounded guest network header capture
        working-directory: Henge
        run: python3 tests/test_net_capture.py 2>&1 | tee "$HENGE_BUILD_LOG_DIR/network-capture-tests.log"

      - name: Test host services
        # The Apple runner supports the actual Unix listener. Keep the
        # socketpair/courier alternative for restricted local test environments.
        env:
          HENGE_TEST_LISTENER: '1'
        working-directory: Henge
        run: python3 tests/test_host_services.py 2>&1 | tee "$HENGE_BUILD_LOG_DIR/host-services-tests.log"

      - name: Test helper installation and independent health
        env:
          HENGE_TEST_LISTENER: '1'
        working-directory: Henge
        run: |
          python3 tests/test_helper_install.py 2>&1 | tee "$HENGE_BUILD_LOG_DIR/helper-install-tests.log"
          make build/test_helper_health build/henge-agent.gz build/henge-helper.app.tar.gz 2>&1 | tee "$HENGE_BUILD_LOG_DIR/helper-health-compile.log"
          build/test_helper_health 2>&1 | tee "$HENGE_BUILD_LOG_DIR/helper-health-tests.log"
          codesign --verify --strict build/henge-agent
          test "$(build/henge-agent --version)" = "henge-agent 11"
          xcrun --sdk macosx swiftc -swift-version 5 ios/Henge/Sharing.swift tests/test_helper_status.swift \
            -o "$RUNNER_TEMP/henge-test-helper-status" 2>&1 | tee "$HENGE_BUILD_LOG_DIR/helper-status-compile.log"
          "$RUNNER_TEMP/henge-test-helper-status" 2>&1 | tee "$HENGE_BUILD_LOG_DIR/helper-status-tests.log"
          xcrun --sdk macosx swiftc -swift-version 5 ios/Henge/Sharing.swift ios/Henge/DeviceAuthProgress.swift tests/test_device_auth_progress.swift \
            -o "$RUNNER_TEMP/henge-test-auth-progress" 2>&1 | tee "$HENGE_BUILD_LOG_DIR/auth-progress-compile.log"
          "$RUNNER_TEMP/henge-test-auth-progress" 2>&1 | tee "$HENGE_BUILD_LOG_DIR/auth-progress-tests.log"

      - name: Run the signed Mac helper through actual LaunchServices
        working-directory: Henge
        run: |
          mkdir -p "$RUNNER_TEMP/henge-helper-runtime"
          tar -xzf build/henge-helper.app.tar.gz -C "$RUNNER_TEMP/henge-helper-runtime"
          codesign --verify --deep --strict "$RUNNER_TEMP/henge-helper-runtime/Henge Helper.app"
          python3 tests/test_helper_macos_runtime.py --mode app \
            --helper "$RUNNER_TEMP/henge-helper-runtime/Henge Helper.app" \
            --output "$HENGE_BUILD_LOG_DIR/helper-app-runtime.json" \
            2>&1 | tee "$HENGE_BUILD_LOG_DIR/helper-app-runtime.log"

      - name: Test small surface layouts and Metal copies
        working-directory: Henge
        run: |
          if bash tests/run_pvg_texture_copy.sh 2>&1 | tee "$HENGE_BUILD_LOG_DIR/texture-copy-tests.log"; then
            printf '%s\n' 'Small surface layout and native Metal pixel tests passed.' >> "$GITHUB_STEP_SUMMARY"
          else
            texture_test_status=$?
            if [ "$texture_test_status" -eq 77 ]; then
              printf '%s\n' '::warning::Native Metal pixel tests were skipped: no compatible Metal GPU is available. This is not a runtime pixel-test pass.'
              printf '%s\n' 'Native Metal pixel tests: SKIPPED (no compatible GPU). See texture-copy-tests.log for compiled and portable test results.' >> "$GITHUB_STEP_SUMMARY"
            else
              exit "$texture_test_status"
            fi
          fi

      - name: Test diagnostics with Foundation
        working-directory: Henge
        run: |
          xcrun --sdk macosx swiftc -swift-version 5 ios/Henge/Diagnostics.swift tests/test_diagnostics.swift \
            -o "$RUNNER_TEMP/henge-test-diagnostics" 2>&1 | tee "$HENGE_BUILD_LOG_DIR/diagnostics-compile.log"
          "$RUNNER_TEMP/henge-test-diagnostics" 2>&1 | tee "$HENGE_BUILD_LOG_DIR/diagnostics-tests.log"

      - name: Test reduced-load resource settings
        working-directory: Henge
        run: |
          xcrun --sdk macosx swiftc -swift-version 5 ios/Henge/ResourcePolicy.swift tests/test_resource_policy.swift \
            -o "$RUNNER_TEMP/henge-test-resource-policy" 2>&1 | tee "$HENGE_BUILD_LOG_DIR/resource-policy-compile.log"
          "$RUNNER_TEMP/henge-test-resource-policy" 2>&1 | tee "$HENGE_BUILD_LOG_DIR/resource-policy-tests.log"

      - name: Test guest Chat diagnostics and request validation
        # This independent parser/transport gate still reports its result when
        # the preceding report-retention test fails. Packaging remains blocked.
        if: ${{ !cancelled() }}
        working-directory: Henge
        run: |
          xcrun --sdk macosx swiftc -swift-version 5 ios/Henge/GuestChatDiagnostics.swift tests/test_guest_chat_diagnostics.swift \
            -o "$RUNNER_TEMP/henge-test-guest-chat" 2>&1 | tee "$HENGE_BUILD_LOG_DIR/guest-chat-swift-compile.log"
          "$RUNNER_TEMP/henge-test-guest-chat" 2>&1 | tee "$HENGE_BUILD_LOG_DIR/guest-chat-swift-tests.log"
          make build/test_guest_chat_diagnostics 2>&1 | tee "$HENGE_BUILD_LOG_DIR/guest-chat-objc-compile.log"
          build/test_guest_chat_diagnostics 2>&1 | tee "$HENGE_BUILD_LOG_DIR/guest-chat-objc-tests.log"

      - name: Read a synthetic error through the real macOS unified log
        working-directory: Henge
        run: |
          make build/test_guest_chat_diagnostics_macos_runtime 2>&1 | tee "$HENGE_BUILD_LOG_DIR/guest-chat-runtime-compile.log"
          build/test_guest_chat_diagnostics_macos_runtime 2>&1 | tee "$HENGE_BUILD_LOG_DIR/guest-chat-runtime-result.log"

      - name: Cache Husk's sources and iOS libraries
        uses: actions/cache@v4
        with:
          path: |
            Husk/third_party/build
            Husk/build
          key: husk-ios-arm64-${{ runner.os }}-${{ steps.source.outputs.husk_sha }}-${{ hashFiles('Husk/scripts/build_ios.sh', 'Husk/scripts/fetch_sources.sh') }}

      - name: Install build tools
        run: |
          exec > >(tee "$HENGE_BUILD_LOG_DIR/build-tools.log") 2>&1
          brew install xcodegen meson ninja pkg-config
          rustup target add aarch64-apple-ios || {
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            rustup target add aarch64-apple-ios
          }

      - name: Fetch Husk's third-party sources
        working-directory: Husk
        run: bash scripts/fetch_sources.sh 2>&1 | tee "$HENGE_BUILD_LOG_DIR/fetch-sources.log"

      - name: Build the iOS libraries Henge needs
        working-directory: Husk
        run: bash scripts/build_ios.sh libffi glib libslirp 2>&1 | tee "$HENGE_BUILD_LOG_DIR/ios-libraries.log"

      - name: Build Husk's on-device pairing library
        working-directory: Husk
        run: bash scripts/build_rppairing_ios.sh 2>&1 | tee "$HENGE_BUILD_LOG_DIR/pairing-library.log"

      - name: Copy dependencies into Henge
        working-directory: Henge
        run: zsh ios/scripts/fetch_deps.sh 2>&1 | tee "$HENGE_BUILD_LOG_DIR/copy-dependencies.log"

      - name: Build the restore stack
        working-directory: Henge
        run: zsh tools/build_ios_restore.sh 2>&1 | tee "$HENGE_BUILD_LOG_DIR/restore-stack.log"

      - name: Build the engine
        working-directory: Henge
        run: make ios-lib 2>&1 | tee "$HENGE_BUILD_LOG_DIR/engine.log"

      - name: Package and validate Henge.tipa
        working-directory: Henge
        run: |
          zsh ios/scripts/package_ipa.sh --trollstore 2>&1 | tee "$HENGE_BUILD_LOG_DIR/package-tipa.log"
          python3 ci/validate-package.py "$HENGE_PACKAGE_OUTPUT_DIR/Henge.tipa" \
            --expected-commit "$HENGE_SOURCE_COMMIT" --husk-commit "$HENGE_HUSK_COMMIT" \
            --expected-version "$HENGE_EXPECTED_VERSION" --expected-build "$HENGE_EXPECTED_BUILD" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --manifest "$HENGE_PACKAGE_OUTPUT_DIR/Henge.tipa.manifest.json" \
            --sha256-file "$HENGE_PACKAGE_OUTPUT_DIR/Henge.tipa.sha256" \
            2>&1 | tee "$HENGE_BUILD_LOG_DIR/validate-tipa.log"

      - name: Upload validated TIPA and manifest
        uses: actions/upload-artifact@v4
        with:
          name: Henge-0.4.0-4012-tipa-${{ github.sha }}
          path: |
            ${{ env.HENGE_PACKAGE_OUTPUT_DIR }}/Henge.tipa
            ${{ env.HENGE_PACKAGE_OUTPUT_DIR }}/Henge.tipa.manifest.json
            ${{ env.HENGE_PACKAGE_OUTPUT_DIR }}/Henge.tipa.sha256
          if-no-files-found: error

      - name: Package and validate optional Henge.ipa
        if: ${{ inputs.include_ipa }}
        working-directory: Henge
        run: |
          zsh ios/scripts/package_ipa.sh 2>&1 | tee "$HENGE_BUILD_LOG_DIR/package-ipa.log"
          python3 ci/validate-package.py "$HENGE_PACKAGE_OUTPUT_DIR/Henge.ipa" \
            --expected-commit "$HENGE_SOURCE_COMMIT" --husk-commit "$HENGE_HUSK_COMMIT" \
            --expected-version "$HENGE_EXPECTED_VERSION" --expected-build "$HENGE_EXPECTED_BUILD" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --manifest "$HENGE_PACKAGE_OUTPUT_DIR/Henge.ipa.manifest.json" \
            --sha256-file "$HENGE_PACKAGE_OUTPUT_DIR/Henge.ipa.sha256" \
            2>&1 | tee "$HENGE_BUILD_LOG_DIR/validate-ipa.log"

      - name: Upload validated optional IPA and manifest
        if: ${{ success() && inputs.include_ipa }}
        uses: actions/upload-artifact@v4
        with:
          name: Henge-0.4.0-4012-ipa-${{ github.sha }}
          path: |
            ${{ env.HENGE_PACKAGE_OUTPUT_DIR }}/Henge.ipa
            ${{ env.HENGE_PACKAGE_OUTPUT_DIR }}/Henge.ipa.manifest.json
            ${{ env.HENGE_PACKAGE_OUTPUT_DIR }}/Henge.ipa.sha256
          if-no-files-found: error

      - name: Upload build logs even after failure
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: Henge-0.4-build-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.HENGE_BUILD_LOG_DIR }}/
            Henge/ios/build/*.buildlog
          if-no-files-found: warn
          retention-days: 30

  publish-test11:
    name: Publish the validated Test 11 prerelease
    needs: build
    if: ${{ success() && github.repository == 'litebeyond123/Henge' && github.ref == 'refs/heads/work/0.4-ipados17-test' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Read release notes from the built commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: docs/release-test11.md
          sparse-checkout-cone-mode: false

      - name: Download the validated package from this run
        uses: actions/download-artifact@v4
        with:
          name: Henge-0.4.0-4012-tipa-${{ github.sha }}
          path: validated-package

      - name: Verify and name release assets
        env:
          BUILT_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil
          folder = pathlib.Path('validated-package')
          package = folder / 'Henge.tipa'
          manifest = json.loads((folder / 'Henge.tipa.manifest.json').read_text())
          digest = hashlib.sha256(package.read_bytes()).hexdigest()
          assert manifest['source']['henge_commit'] == os.environ['BUILT_COMMIT'], 'Source commit mismatch'
          assert manifest['application']['version'] == '0.4.0', 'Version mismatch'
          assert manifest['application']['build'] == '4012', 'Build mismatch'
          assert manifest['package']['sha256'] == digest, 'Package digest mismatch'
          out = pathlib.Path('release-assets')
          out.mkdir()
          name = 'Henge-0.4.0-test11.tipa'
          shutil.copyfile(package, out / name)
          manifest['package']['filename'] = name
          (out / 'Henge-0.4.0-test11.manifest.json').write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n')
          (out / 'Henge-0.4.0-test11.sha256').write_text(f'{digest}  {name}\n')
          print(f'Validated Test 11 package: {digest}')
          PY

      - name: Publish Test 11 as a prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILT_COMMIT: ${{ github.sha }}
        run: |
          gh release create v0.4.0-test11 \
            --target "$BUILT_COMMIT" --prerelease --latest=false \
            --title "Henge 0.4 Test 11 (4012)" \
            --notes-file docs/release-test11.md \
            release-assets/Henge-0.4.0-test11.tipa \
            release-assets/Henge-0.4.0-test11.manifest.json \
            release-assets/Henge-0.4.0-test11.sha256
